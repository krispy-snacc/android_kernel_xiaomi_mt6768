name: Build KernelSU for Merlin Android 12
on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel Image
    runs-on: ubuntu-22.04
    steps:
      - name: Provision Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 zlib1g-dev libncurses5-dev squashfs-tools xsltproc zip zstd cpio
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Repository Source Tree
        uses: actions/checkout@v4
        with:
          ref: twelve
          fetch-depth: 1

      - name: Automatic KernelSU Non-GKI Injection
        run: |
          DOMAIN="github.com"
          TARGET_USER="tiann"
          TARGET_REPO="KernelSU"
          CONSTRUCTED_URL="https://${DOMAIN}/${TARGET_USER}/${TARGET_REPO}.git"
          
          mkdir kernelsu_engine
          cd kernelsu_engine
          git init
          git remote add origin "$CONSTRUCTED_URL"
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD
          cd ..
          
          mv kernelsu_engine/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Execute Manual Kernel 4.14 Intrusive Hooks
        run: |
          # 1. Splice fs/read_write.c hook parameter
          sed -i '/ssize_t ksys_read(/a \    extern int ksu_handle_read(struct file *file, char __user *buf, size_t count, loff_t *pos);\n    ksu_handle_read(file, buf, count, pos);' fs/read_write.c

          # 2. Splice fs/open.c execution tracker hook
          sed -i '/int do_faccessat(/a \    extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n    ksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

          # 3. Safely append the hardware hook parameter to the end of input.c
          echo -e '\nint ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value) { return 0; }' >> drivers/input/input.c

          # 4. ROBUST INLINE CORRECTION: Cleanly strip the strict inline requirement tags from crypto system layouts
          # This transforms the broken forced-inline code fragments into valid standard system functions
          if [ -f include/linux/keyslot-manager.h ]; then
            sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
          fi
          if [ -f include/linux/blk-crypto.h ]; then
            sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
          fi

      - name: Run Cross-Compiler Pipeline
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Force disable the problematic kheaders module directly inside the core configuration
          sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' arch/arm64/configs/merlin_defconfig
          echo "CONFIG_IKHEADERS=n" >> arch/arm64/configs/merlin_defconfig
          
          # Initialize the custom MediaTek Merlin target map configuration layer
          make merlin_defconfig
          
          # Fix the internal kernel tools missing path bug by forcefully mapping cpio to standard system links
          mkdir -p tools/build
          ln -sf /usr/bin/cpio tools/build/cpio
          
          # --- THE ROBUST GLOBAL ROUTING MAP ---
          # Keeps our global MediaTek folder indexing path maps active to block layout errors automatically
          GLOBAL_FLAGS="-Wno-error -Wno-inline -fno-pic -I\$(srctree)/drivers/devfreq -I\$(srctree)/drivers/mmc/host/mediatek/ComboA -I\$(srctree)/drivers/mmc/host/mediatek/ComboA/mt6768 -I\$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/inc -I\$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6768"
          
          sed -i "s|KBUILD_CFLAGS   :=|KBUILD_CFLAGS   := $GLOBAL_FLAGS |g" Makefile
          
          # Run execution compilation sweep matching hardware thread counts
          make -j$(nproc)

      - name: Collect and Package Target Artifacts
        run: |
          mkdir deploy_space
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb deploy_space/boot.img
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz deploy_space/boot.img
          else
            echo "Compilation Engine Failure: Image core could not be tracked." && exit 1
          fi

      - name: Store Flashable Core Build Output
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Stock-A12-Merlin
          path: deploy_space/boot.img
